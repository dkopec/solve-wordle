name: Auto Release

on:
  push:
    branches:
      - main
  workflow_dispatch:  # Manual trigger option

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Get all history for changelog
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Conventional Changelog Action
        id: changelog
        uses: TriPSs/conventional-changelog-action@v5
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          version-file: './version.json'
          version-path: 'version'
          skip-on-empty: true
          skip-version-file: false
          skip-commit: false
          git-message: 'chore(release): {version} [skip ci]'
          preset: 'conventionalcommits'
          tag-prefix: 'v'
          output-file: 'CHANGELOG.md'
          release-count: '0'  # Include all releases in changelog
          git-push: false  # Don't push yet - we need to update .csproj first

      - name: Update .csproj version to match
        if: ${{ steps.changelog.outputs.skipped == 'false' }}
        shell: pwsh
        run: |
          .\.github\scripts\update-csproj-version.ps1 -VersionJsonPath "./version.json" -CsprojPath "./solve-wordle.csproj"

      - name: Amend the release commit with .csproj changes
        if: ${{ steps.changelog.outputs.skipped == 'false' }}
        run: |
          git config user.name "Conventional Changelog Action"
          git config user.email "conventional.changelog.action@github.com"
          git add solve-wordle.csproj
          git commit --amend --no-edit
          git tag -f ${{ steps.changelog.outputs.tag }}
          git push --force-with-lease
          git push --tags --force

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        if: ${{ steps.changelog.outputs.skipped == 'false' }}
        with:
          tag_name: ${{ steps.changelog.outputs.tag }}
          name: Release ${{ steps.changelog.outputs.tag }}
          body: ${{ steps.changelog.outputs.clean_changelog }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Output release info
        if: ${{ steps.changelog.outputs.skipped == 'false' }}
        run: |
          echo "New version: ${{ steps.changelog.outputs.version }}"
          echo "Tag created: ${{ steps.changelog.outputs.tag }}"
          echo "Release URL: https://github.com/${{ github.repository }}/releases/tag/${{ steps.changelog.outputs.tag }}"
